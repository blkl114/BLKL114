<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>简历 · blkl114</title>
  <meta name="description" content="blkl114 的在线简历：教育经历、技能、项目与实践。" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232563eb'/%3E%3Ctext x='50' y='70' font-size='56' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3Eb%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body data-page="resume">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" id="brand-mark" aria-hidden="true">b</span>
        <span class="brand-text" id="brand-text">blkl114</span>
      </a>

      <nav class="nav" id="nav" aria-label="主导航">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>

      <div class="header-actions">
        <button class="icon-btn lang-btn" id="lang-toggle" type="button" title="中文 / English" aria-label="切换语言">
          <span id="lang-label">EN</span>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深色 / 浅色主题" title="切换主题">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
      </div>
    </div>
    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
  </header>

  <main id="main">
    <div class="container resume-toolbar">
      <a class="btn btn-ghost" href="index.html">← 首页 / Home</a>
      <button class="btn btn-primary" id="print-btn" type="button">打印 / 保存为 PDF</button>
    </div>

    <!-- 简历主体由 assets/js/render.js 依据 data.js 渲染 -->
    <article class="container resume-sheet" id="resume-root"></article>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('print-btn');
      if (btn) btn.addEventListener('click', function () { window.print(); });
    })();
  </script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/render.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
