<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · 页面未找到 | 刘子凡</title>
  <meta name="description" content="页面未找到。" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232563eb'/%3E%3Ctext x='50' y='70' font-size='56' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3Eb%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .error-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .error-code {
      margin: 0;
      font-size: clamp(4rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
    }
    .error-page h1 { font-size: clamp(1.3rem, 4vw, 1.9rem); }
    .error-page p { color: var(--text-muted); }
    .error-actions { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin-top: 1.4rem; }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-code gradient-text">404</p>
      <h1>页面走丢了</h1>
      <p>你访问的地址不存在，或者已经被移动到别处。</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">回到首页</a>
        <a class="btn btn-ghost" href="https://github.com/blkl114" target="_blank" rel="noopener">我的 GitHub</a>
      </div>
    </div>
  </main>
</body>
</html>
